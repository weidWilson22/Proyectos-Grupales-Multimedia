<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Kárdex UMSA</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #003366;
            border-bottom: 2px solid #003366;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #003366;
            color: white;
        }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-pendiente { background-color: #ffeeba; color: #856404; }
        .badge-aprobado { background-color: #d4edda; color: #155724; }
        .btn-accion {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background-color: #28a745;
        }
        .btn-accion:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>👨‍💼 Panel de Control de Titulación - Kárdex</h2>
        <p>Listado de solicitudes de modalidad registradas en el sistema:</p>

        <table>
            <thead>
                <tr>
                    <th>R.U.</th>
                    <th>Estudiante</th>
                    <th>C.I.</th>
                    <th>Título del Proyecto / Tesis</th>
                    <th>Estado Actual</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaSolicitudes">
                <tr>
                    <td colspan="6" style="text-align: center; color: #666;">Cargando trámites...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", cargarSolicitudes);

        async function cargarSolicitudes() {
            const tbody = document.getElementById("tablaSolicitudes");
            
            try {
                const respuesta = await fetch('/admin/solicitudes');
                const solicitudes = await respuesta.json();

                if (solicitudes.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">No hay trámites registrados por el momento.</td></tr>`;
                    return;
                }

                tbody.innerHTML = ""; // Limpiamos la fila de carga
                
                solicitudes.forEach(sol => {
                    const esPendiente = sol.estado_actual === 'Revision_Documentos';
                    
                    const fila = document.createElement("tr");
                    fila.innerHTML = `
                        <td><strong>${sol.ru}</strong></td>
                        <td>${sol.nombre_estudiante}</td>
                        <td>${sol.ci_estudiante}</td>
                        <td><em>"${sol.proyecto}"</em></td>
                        <td>
                            <span class="badge ${esPendiente ? 'badge-pendiente' : 'badge-aprobado'}">
                                ${esPendiente ? 'Pendiente' : 'Aprobado'}
                            </span>
                        </td>
                        <td>
                            ${esPendiente ? 
                                `<button class="btn-accion" onclick="aceptarTramite('${sol.id_tramite}')">Aceptar</button>` : 
                                `<span style="color: #28a745; font-weight:bold;">✓ Listo</span>`
                            }
                        </td>
                    `;
                    tbody.appendChild(fila);
                });

            } catch (error) {
                console.error("Error al cargar la tabla:", error);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">Error al conectar con el backend.</td></tr>`;
            }
        }

        async function aceptarTramite(idTramite) {
            if(!confirm("¿Está seguro de otorgar el visto bueno y aprobar este trámite de modalidad?")) return;

            try {
                const respuesta = await fetch('/admin/cambiar-estado', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_tramite: idTramite,
                        nuevo_estado: 'Aprobado'
                    })
                });

                const resultado = await respuesta.json();
                alert(resultado.mensaje);
                
                // Recargamos la tabla para ver el cambio reflejado en tiempo real
                cargarSolicitudes();

            } catch (error) {
                alert("No se pudo procesar la aprobación.");
            }
        }
    </script>
</body>
</html>
