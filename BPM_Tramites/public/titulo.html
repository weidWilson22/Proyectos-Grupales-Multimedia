<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Titulación - UMSA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            color: #003366;
            margin-top: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alerta-verde {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            font-size: 16px;
        }
        .alerta-roja {
            background-color: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid #f5c6cb;
            text-align: center;
        }
        .seccion-datos {
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #00509d;
            line-height: 1.8;
            font-size: 16px;
        }
        .seccion-datos strong {
            color: #333;
        }
        .bton-contenedor {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-siguiente {
            background-color: #00509d;
        }
        .btn-siguiente:hover {
            background-color: #003f7a;
        }
        .btn-anterior {
            background-color: #00509d;
        }
        .btn-anterior:hover {
            background-color: #003f7a;
        }
    </style>
</head>
<body>

    <div class="container" id="panel-tramite">
        <p style="text-align: center; color: #666;">Verificando expediente del estudiante...</p>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        const panel = document.getElementById("panel-tramite");

        // 1. Recuperar la sesión del estudiante logueado
        let usuario = JSON.parse(localStorage.getItem("usuarioActivo")) || JSON.parse(localStorage.getItem("usuario"));

        // Si no hay sesión activa
        if (!usuario || !usuario.ru) {
            panel.innerHTML = `
                <div class="alerta-roja">
                    ❌ Error: No se detectó ninguna sesión de estudiante activa.
                </div>
                <button class="btn btn-anterior" style="margin-top: 15px; width: 100%;" onclick="window.location.href='index.html'">Ir al Login</button>
            `;
            return;
        }

        try {
            // 2. Consultar el archivo JSON de récords académicos
            const respuestaRecord = await fetch('/data/record_academico.json');
            const records = await respuestaRecord.json();

            const expediente = records.find(r => r.ru === usuario.ru);
            const materiasAprobadas = expediente ? expediente.materiasAprobadas : [];
            const totalAprobadas = materiasAprobadas.length;
            const totalPlanCurricular = 17; 

            // 3. SI NO CUMPLE CON LAS 17 MATERIAS: Se bloquea y NO se muestra el botón Siguiente
            if (totalAprobadas < totalPlanCurricular) {
                panel.innerHTML = `
                    <h2>📋 Verificación Académica</h2>
                    <div class="alerta-roja" style="text-align: left; margin-bottom: 25px;">
                        ❌ Requisito Insuficiente. <br><br>
                        Para iniciar el trámite de titulación debes concluir el plan de estudios obligatorio.<br><br>
                        <strong>Materias Aprobadas:</strong> ${totalAprobadas} de ${totalPlanCurricular}<br>
                        <strong>Materias Faltantes:</strong> ${totalPlanCurricular - totalAprobadas} asignaturas.
                    </div>

                    <div class="bton-contenedor">
                        <button class="btn btn-anterior" style="width: 100%;" onclick="history.back()">
                            Anterior
                        </button>
                    </div>
                `;
                return;
            }

            // 4. SI CUMPLE CON LAS 17 MATERIAS: Se le muestra el éxito y ambos botones para avanzar
            panel.innerHTML = `
                <h2>📋 Verificación Académica</h2>
                
                <div class="alerta-verde">
                    ✓ ¡Expediente Válido! Has aprobado las ${totalPlanCurricular} materias del plan curricular.
                </div>

                <div class="seccion-datos">
                    <strong>Postulante:</strong> ${usuario.nombre}<br>
                    <strong>Carrera:</strong> ${usuario.carrera}<br>
                    <strong>R.U.:</strong> ${usuario.ru}
                </div>

                <div class="bton-contenedor">
                    <button class="btn btn-anterior" onclick="window.location.href='dashboard.html'">
                        Anterior
                    </button>
                    <button class="btn btn-siguiente" onclick="window.location.href='requisito.html'">
                        Siguiente
                    </button>
                    
                </div>
            `;

        } catch (error) {
            console.error("Error al cargar los datos de verificación:", error);
            panel.innerHTML = `<div class="alerta-roja">❌ Error de infraestructura al conectar con el Kárdex Digital.</div>`;
        }
    });
</script>
</body>
</html>
